name: Feature request
description: Propose a consumer-backed capability
title: 'feature: '
labels: [enhancement]
body:
  - type: textarea
    id: consumer
    attributes:
      label: Consumer need
      description: Which real application needs this and what cannot it do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe behavior rather than locking an API signature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: boundary
    attributes:
      label: Likely package boundary
      options:
        - Existing root API
        - React binding
        - Optional subpath
        - Unsure
    validations:
      required: true
