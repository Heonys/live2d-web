name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 이전 실행 취소 — CI 분 절약
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # 라이브러리는 퍼블리시 산출물(dist)이 제품이므로 빌드 검증을 test 잡에 포함한다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm api:check
      - run: pnpm examples:build
      - run: pnpm docs:check
      - run: pnpm verify:package
      - run: pnpm verify:packed-consumers
      # The playground build asserts the tracking assets exist, because a deploy
      # without them serves 404s and face tracking dies in every browser.
      - run: pnpm fetch-mediapipe-assets
      - run: pnpm -F @live2d-web/playground build

  # Hiyori and Cubism Core are licensed downloads: fetched fresh each run
  # against the official terms, never stored in the Actions cache or an
  # artifact. Fork PRs cannot receive them and are checked by the main run
  # after merge instead. Firefox runs headed under Xvfb: headless Firefox on
  # the runner has no WebGL2. Nothing is uploaded on failure: a Playwright
  # trace carries network response bodies, which would put Core and Hiyori
  # into an artifact. Failures reach the run as annotations; reproduce a
  # trace locally.
  browser-e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      LIVE2D_ACCEPT_TERMS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-assets
      - uses: actions/cache@v4
        with:
          path: apps/playground/public/assets/mediapipe
          key: mediapipe-web-1.0.1-face-landmarker-float16-v1
      - run: pnpm fetch-mediapipe-assets
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'firefox'
        run: sudo apt-get install -y xvfb
      - run: pnpm -F @live2d-web/playground build
      - run: ${{ matrix.browser == 'firefox' && 'xvfb-run -a' || '' }} pnpm test:e2e --project=${{ matrix.browser }}

  # Firefox infers an order of magnitude slower; the adaptive cap lets it pass
  # (docs/benchmarks/2026-08-25-0.5.0-candidate.md), so it blocks like the rest.
  tracking-e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
          - browser: webkit
            # Playwright's Linux WebKitGTK stalls while MediaPipe initializes
            # inside Next/Turbopack's classic worker bootstrap. macOS WebKit is
            # the closer Safari gate and runs the same main/Worker assertions.
            os: macos-latest
          - browser: firefox
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: apps/playground/public/assets/mediapipe
          key: mediapipe-web-1.0.1-face-landmarker-float16-v1
      - run: pnpm fetch-mediapipe-assets
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'firefox'
        run: sudo apt-get install -y xvfb
      - run: pnpm -F @live2d-web/playground build
      - run: ${{ matrix.browser == 'firefox' && 'xvfb-run -a' || '' }} pnpm test:tracking:e2e --project=${{ matrix.browser }}
