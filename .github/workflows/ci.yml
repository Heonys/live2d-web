name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 이전 실행 취소 — CI 분 절약
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # 라이브러리는 퍼블리시 산출물(dist)이 제품이므로 빌드 검증을 test 잡에 포함한다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm verify:package
      - run: pnpm verify:packed-consumers
      - run: pnpm -F @live2d-web/playground build

  # Hiyori and Cubism Core are licensed downloads: fetched fresh each run
  # against the official terms, never stored in the Actions cache or an
  # artifact. Fork PRs cannot receive them and are checked by the main run
  # after merge instead. Firefox reports but does not block until headless
  # WebGL2 on the Linux runner is confirmed (docs/compatibility.md).
  browser-e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    continue-on-error: ${{ matrix.browser == 'firefox' }}
    env:
      LIVE2D_ACCEPT_TERMS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-assets
      - uses: actions/cache@v4
        with:
          path: apps/playground/public/assets/mediapipe
          key: mediapipe-web-1.0.1-face-landmarker-float16-v1
      - run: pnpm fetch-mediapipe-assets
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'firefox'
        run: sudo apt-get install -y xvfb
      - run: pnpm -F @live2d-web/playground build
      - run: ${{ matrix.browser == 'firefox' && 'xvfb-run -a' || '' }} pnpm test:e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-e2e-results-${{ matrix.browser }}
          path: test-results
          retention-days: 7

  # Firefox is measured well past the inference budget (docs/compatibility.md),
  # so it reports but does not block until the adaptive cap proves it stable.
  tracking-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    continue-on-error: ${{ matrix.browser == 'firefox' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: apps/playground/public/assets/mediapipe
          key: mediapipe-web-1.0.1-face-landmarker-float16-v1
      - run: pnpm fetch-mediapipe-assets
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'firefox'
        run: sudo apt-get install -y xvfb
      - run: pnpm -F @live2d-web/playground build
      - run: ${{ matrix.browser == 'firefox' && 'xvfb-run -a' || '' }} pnpm test:tracking:e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tracking-e2e-results-${{ matrix.browser }}
          path: test-results
          retention-days: 7
