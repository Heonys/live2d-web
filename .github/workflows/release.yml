name: Release

# Publishes the version in packages/live2d-web/package.json when its tag is
# pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write: the GitHub release at the end of the job is created with the
      # workflow token.
      contents: write
      # Required twice over: npm authenticates the publish through this OIDC
      # token, and the provenance attestation is signed with it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No dependency cache here, unlike CI: a release resolves everything from
      # the registry so that a poisoned cache entry cannot reach the artifact
      # that gets signed and published.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # The tag decides nothing on its own: npm publishes whatever version the
      # manifest carries. Fail loudly rather than release a mismatched version.
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/live2d-web/package.json').version")
          if [ "refs/tags/v$version" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match package version $version." >&2
            exit 1
          fi

      # The published artifact is the product, so the gates run against the
      # exact commit being released.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:package
      - run: pnpm verify:packed-consumers

      # Both e2e suites against the real Cubism Core, Hiyori and MediaPipe
      # assets, matching ci.yml's gate; ci.yml splits them per browser for
      # wall-clock, a release runs each suite's three projects in one command.
      # No asset cache here for the same reason there is no dependency cache
      # above. Firefox needs a display for WebGL2 on this runner, so the whole
      # run sits under Xvfb; the headless browsers ignore it.
      - run: pnpm fetch-assets
        env:
          LIVE2D_ACCEPT_TERMS: '1'
      - run: pnpm fetch-mediapipe-assets
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y xvfb
      - run: pnpm -F @live2d-web/playground build
      - run: xvfb-run -a pnpm test:e2e
      - run: xvfb-run -a pnpm test:tracking:e2e

      # pnpm packs (it resolves the catalog: protocol that npm cannot read),
      # npm publishes (pnpm has no trusted-publishing support).
      - run: pnpm --filter live2d-web pack --pack-destination .

      # No token: npm authenticates through the trusted publisher registered
      # for this package, which names this repository and this workflow file.
      # Renaming this file breaks publishing until npm is updated to match.
      # Trusted publishing needs npm 11.5.1 or later, which the npm bundled
      # with Node is not guaranteed to be.
      - run: npm install -g npm@latest
      - run: npm publish ./live2d-web-*.tgz --provenance --access public

      # The npm publish is the release; the GitHub release page mirrors it with
      # the version's CHANGELOG section as the notes.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
