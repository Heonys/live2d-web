# Deploys apps/playground as the public demo.
#
# The Cubism Core script and the Hiyori sample model are deliberately not in the
# repository, so the build downloads them first. Without that step the pages
# still build and load, but no character appears.

[build]
command = "pnpm fetch-assets && pnpm --filter @live2d-web/playground build"
publish = "apps/playground/.next"

[build.environment]
NODE_VERSION = "24"
# Confirms the official terms that the fetch script prints (Cubism Core,
# Hiyori, CubismWebSamples). Not a secret, and keeping it here means a build
# never depends on hidden dashboard state.
LIVE2D_ACCEPT_TERMS = "1"

[[plugins]]
package = "@netlify/plugin-nextjs"
