catalogMode: prefer

shellEmulator: true

trustPolicy: no-downgrade

# provenance 도입(2023) 이전 구버전들 — 최신 버전에 provenance가 있어 위양성으로 걸림
trustPolicyExclude:
  - semver@6.3.1

packages:
  - apps/**
  - packages/**
  - '!packages/live2d-jsx/vendor/**'

catalog:
  '@antfu/eslint-config': ^9.2.0
  '@eslint-react/eslint-plugin': ^5.18.0
  # pixi-v6 어댑터용 (PIXI v6 고정 — pixi-live2d-display@0.4가 v7/v8 미지원)
  '@pixi/app': ^6.5.10
  '@pixi/constants': ^6.5.10
  '@pixi/core': ^6.5.10
  '@pixi/display': ^6.5.10
  '@pixi/extensions': ^6.5.10
  '@pixi/interaction': ^6.5.10
  '@pixi/loaders': ^6.5.10
  '@pixi/math': ^6.5.10
  '@pixi/runner': ^6.5.10
  '@pixi/settings': ^6.5.10
  '@pixi/sprite': ^6.5.10
  '@pixi/ticker': ^6.5.10
  '@pixi/utils': ^6.5.10
  '@playwright/test': ^1.55.0
  '@testing-library/react': ^16.3.0
  '@types/node': ^26.1.2
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  eslint: ^10.2.1
  eslint-plugin-format: ^2.0.1
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.3
  jsdom: ^26.1.0
  nano-staged: ^1.0.2
  # runtime
  next: ^16.2.12
  pixi-live2d-display: ^0.4.0
  react: ^19.2.8
  react-dom: ^19.2.8
  simple-git-hooks: ^2.13.1
  taze: ^19.11.0
  # tooling
  tsdown: ^0.22.14
  tsx: ^4.21.0
  typescript: ^5.9.3
  vite: ^8.1.5
  wlipsync: ^1.3.0

catalogs:
  vitest:
    vitest: ^4.1.4

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
